<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://www.javivela.dev/libros/kubernetes-101/">
  <title>Abriendo la suscripción…</title>
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token": "50d9f6beac8b4fb39fb24b63102848ce"}'></script>
  <script>
    /* Espera un momento a que el beacon de Cloudflare registre la visita y salta.
       Esta pagina existe solo para poder medir los clics salientes: Cloudflare Web
       Analytics no tiene eventos personalizados, asi que se miden como paginas.
    
       Ademas acepta un parametro opcional ?de=<origen> y lo traduce a utm_source
       para el panel de Substack, de forma que el mismo enlace sirva para todos los
       canales y se pueda separar despues:
         /ir/substack/?de=linkedin
         /ir/substack/?de=x
       Sin parametro, o con un valor que no este en la lista, va como "web". */
    (function () {
      var BASE = "https://blog.javivela.dev/subscribe";
      var PERMITIDOS = ["linkedin", "x", "web", "correo", "github", "libro"];
      var origen = "web";
      try {
        var de = new URLSearchParams(location.search).get("de");
        if (de && PERMITIDOS.indexOf(de.toLowerCase()) !== -1) origen = de.toLowerCase();
      } catch (e) { /* navegador antiguo: se queda en "web" */ }
      var destino = BASE + "?utm_source=" + origen + "&utm_medium=social&utm_campaign=suscripcion";
      var manual = document.getElementById("manual");
      if (manual) manual.href = destino;
      setTimeout(function () { location.replace(destino); }, 300);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://blog.javivela.dev/subscribe">
  </noscript>
</head>

<body
  style="background:#0a0e1a;color:#e8ecf4;font-family:'Space Grotesk',system-ui,sans-serif;text-align:center;padding:80px 24px">
  <p>Abriendo la suscripción…</p>
  <p><a id="manual" href="https://blog.javivela.dev/subscribe" style="color:#5b8ef0">Si no se abre solo, pulsa aquí</a>
  </p>

      style="color:#8b95ab;font-size:14px">Volver a la ficha del libro</a></p>
</body>

</html>
